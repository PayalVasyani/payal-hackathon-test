<app-navbar></app-navbar>

<div class="page-container">
  <div class="header-section">
    <h2>Create Load</h2>
    <div class="actions">
      <button class="btn btn-outline" routerLink="/loads">Back to Loads</button>
    </div>
  </div>

  <div class="card" style="max-width: 650px; margin: 0 auto;">
    <div *ngIf="error" class="error-state">
      {{ error }}
    </div>

    <form [formGroup]="loadForm" (ngSubmit)="onSubmit()">
      <!-- Full Width Row -->
      <div class="form-row">
        <div class="form-group full-width">
          <label>Select Shipper</label>
          <div *ngIf="loadingShippers" class="text-muted">Loading shippers...</div>
          <div *ngIf="!loadingShippers && shippers.length === 0" class="error-text">
            No shippers available in the system.
          </div>
          <select formControlName="shipperId" class="form-control" *ngIf="!loadingShippers && shippers.length > 0">
            <option value="" disabled selected>Select a shipper...</option>
            <option *ngFor="let shipper of shippers" [value]="shipper.id">
              {{ shipper.name }} ({{ shipper.email }})
            </option>
          </select>
          <small class="error-text" *ngIf="loadForm.get('shipperId')?.touched && loadForm.get('shipperId')?.invalid">
            You must select a Shipper.
          </small>
        </div>
      </div>

      <!-- 2-Column Row: Locations -->
      <div class="form-row split">
        <div class="form-group">
          <label>Origin City</label>
          <input type="text" formControlName="origin" class="form-control" placeholder="e.g. Chicago, IL">
        </div>
        <div class="form-group">
          <label>Destination City</label>
          <input type="text" formControlName="destination" class="form-control" placeholder="e.g. Dallas, TX">
        </div>
      </div>

      <!-- 2-Column Row: Dates -->
      <div class="form-row split">
        <div class="form-group">
          <label>Pickup Date</label>
          <input type="date" formControlName="pickupDate" class="form-control">
        </div>
        <div class="form-group">
          <label>Estimated Delivery Date</label>
          <input type="date" formControlName="deliveryDate" class="form-control">
        </div>
      </div>

      <!-- 2-Column Row: Freight Details -->
      <div class="form-row split">
        <div class="form-group">
          <label>Commodity Description</label>
          <input type="text" formControlName="commodity" class="form-control" placeholder="e.g. Industrial Equipment & Parts">
        </div>
        <div class="form-group">
          <label>Total Weight (LBS)</label>
          <input type="number" formControlName="weight" class="form-control" placeholder="e.g. 34500">
        </div>
      </div>

      <!-- 2-Column Row: Equipment & Rate -->
      <div class="form-row split">
        <div class="form-group">
          <label>Equipment Requirement</label>
          <select formControlName="equipmentType" class="form-control">
            <option value="" disabled selected>Select equipment...</option>
            <option *ngFor="let eq of equipmentTypes" [value]="eq">{{ eq }}</option>
          </select>
        </div>
        <div class="form-group">
          <label style="display: flex; justify-content: space-between; align-items: center;">
            Target Offer ($ USD)
            <span class="badge badge-posted" style="font-size: 0.65rem;">Optional</span>
          </label>
          <input type="number" formControlName="targetOffer" class="form-control" placeholder="e.g. 4500">
        </div>
      </div>

      <div style="margin-top: 2rem; display: flex; justify-content: flex-end;">
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 1rem;" [disabled]="loadForm.invalid || submitting">
          {{ submitting ? 'Posting Load...' : 'Post Freight Load' }}
        </button>
      </div>
    </form>
  </div>
</div>
